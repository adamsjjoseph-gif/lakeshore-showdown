# Render Blueprint: New > Blueprint > pick this repo. Creates a $7/mo Starter web service + 1 GB disk (~$0.25/mo).
services:
  - type: web
    name: lakeshore-showdown
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: showdown-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/spiff.db
      - key: SEED_DEMO
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: STORE_PIN_1
        sync: false
